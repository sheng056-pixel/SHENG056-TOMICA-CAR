<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruden's Mini Car Shop & 智慧查價系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <div class="max-w-6xl mx-auto p-4">
        <header class="flex flex-col md:flex-row justify-between items-center py-6 border-b border-slate-200 mb-6 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800">🚗 Ruden's Mini Car Shop</h1>
                <p class="text-sm text-slate-500 mt-1">雲端即時同步查價系統 ＆ 現貨模型車賣場</p>
            </div>
            <div id="auth-container" class="flex items-center gap-3">
                <span id="sync-status" class="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">⏳ 正在同步雲端成交紀錄...</span>
                <button onclick="openLoginModal()" class="px-4 py-2 bg-slate-800 text-white text-sm rounded-lg font-bold shadow hover:bg-slate-700 transition">🔐 管理員登入</button>
            </div>
        </header>

        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button onclick="switchTab('shop')" id="btn-shop" class="px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold">🛒 現貨賣場</button>
            <button onclick="switchTab('pricing')" id="btn-pricing" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow">🔍 雲端歷史成交查價</button>
            <button onclick="switchTab('admin')" id="btn-admin" class="hidden px-6 py-2.5 bg-amber-600 text-white rounded-lg font-bold shadow">⚙️ 上架管理後台</button>
        </div>

        <div id="tab-pricing" class="space-y-4 max-w-3xl mx-auto">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 class="font-bold text-lg text-slate-800">📊 雲端歷史成交與行情查價中心</h2>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">文字 / 標題智慧搜尋（自動對應雲端 600+ 筆資料）</label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="例如輸入：閃電麥坤 或 貼上日拍標題..." class="w-full p-3.5 pl-4 pr-20 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner" oninput="searchData()">
                        <button onclick="document.getElementById('search-input').value=''; searchData();" class="absolute right-3 top-3 px-3 py-1.5 bg-slate-100 text-slate-600 text-xs rounded-lg hover:bg-slate-200">清除</button>
                    </div>
                </div>
                <div id="search-result" class="space-y-3 mt-4">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                        <p class="text-xs text-amber-800 font-bold">💡 提示：輸入關鍵字，系統會精準抓取您試算表 F 欄的車名與 L 欄的價格！</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-shop" class="hidden space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="shop-product-grid"></div>
        </div>
        <div id="tab-admin" class="hidden space-y-4 max-w-xl mx-auto"></div>
    </div>

    <script>
        const cloudCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTItsSiLskQi5hiYkIyL34MQgMuGGU2NuzSyOVp94tKBGyJqqIEs_IkN6Ez0fjhuBjNG4GIQ9MS_ZqN/pub?gid=680043717&single=true&output=csv";
        let cloudPricingData = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await loadCloudData();
        });

        // 核心修正：依照你的截圖，完美對齊 D欄、F欄、L欄、O欄
        async function loadCloudData() {
            const statusEl = document.getElementById('sync-status');
            try {
                const response = await fetch(cloudCsvUrl);
                const csvText = await response.text();
                const lines = csvText.split('\n');
                cloudPricingData = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^["']\vert{}["']$/g, ''));
                    
                    // 確保讀到 L 欄 (索引11) 且 F 欄 (索引5) 真的有車名才寫入
                    if (cols.length >= 12 && cols[5]) {
                        cloudPricingData.push({
                            category: cols[3] || "未分類",     // D 欄: 品牌
                            name: cols[5],                   // F 欄: 車款名稱
                            price: cols[11] || "0",          // L 欄: 成交價
                            desc: cols[14] || ""             // O 欄: 備註
                        });
                    }
                }
                statusEl.textContent = `✅ 雲端同步完成 (${cloudPricingData.length} 筆)`;
                statusEl.className = "text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-300 font-bold";
            } catch (error) {
                statusEl.textContent = "⚠️ 雲端同步失敗";
                statusEl.className = "text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200";
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById('tab-pricing').classList.add('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
            document.getElementById('btn-shop').className = 'px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold';
            document.getElementById('btn-pricing').className = 'px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold';

            if (tab === 'shop') {
                document.getElementById('tab-shop').classList.remove('hidden');
                document.getElementById('btn-shop').className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow';
            } else if (tab === 'pricing') {
                document.getElementById('tab-pricing').classList.remove('hidden');
                document.getElementById('btn-pricing').className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow';
            }
        }

        function searchData() {
            let rawInput = document.getElementById('search-input').value.trim().toLowerCase();
            const resultDiv = document.getElementById('search-result');
            
            if (!rawInput) {
                resultDiv.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-200 rounded-xl"><p class="text-xs text-amber-800 font-bold">💡 請輸入關鍵字搜尋您的完整成交紀錄。</p></div>`;
                return;
            }

            let cleanKeyword = rawInput.replace(/[￥円,\s]/g, '');
            const matches = cloudPricingData.filter(item => 
                item.name.toLowerCase().includes(rawInput) || 
                item.name.toLowerCase().includes(cleanKeyword) ||
                item.desc.toLowerCase().includes(rawInput)
            );

            if (matches.length === 0) {
                resultDiv.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl"><p class="text-xs text-red-700 font-bold">在雲端紀錄中找不到符合的車款。</p></div>`;
                return;
            }

            let htmlOutput = `<p class="text-xs text-slate-500 mb-2">🔎 找到 ${matches.length} 筆成交紀錄：</p>`;
            matches.forEach(item => {
                htmlOutput += `
                    <div class="p-4 border rounded-xl bg-blue-50/40 space-y-1 mb-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-800">${item.name}</span>
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-medium">${item.category}</span>
                        </div>
                        <div class="text-sm text-slate-600 space-y-0.5 pt-1">
                            <p>📌 <b>成交價</b>：NT$ ${item.price}</p>
                            <p>📦 <b>紀錄備註</b>：${item.desc}</p>
                        </div>
                    </div>
                `;
            });
            resultDiv.innerHTML = htmlOutput;
        }
    </script>
</body>
</html>
