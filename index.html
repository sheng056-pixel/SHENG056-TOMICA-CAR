<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruden's Mini Car Shop & AI 智慧以圖查價系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <div class="max-w-6xl mx-auto p-4">
        <!-- 頂部標題與登入區 -->
        <header class="flex flex-col md:flex-row justify-between items-center py-6 border-b border-slate-200 mb-6 gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800">🚗 Ruden's Mini Car Shop</h1>
                    <span class="text-[11px] bg-emerald-600 text-white px-2.5 py-0.5 rounded-full font-bold shadow-sm">v5.1 語法修復極速版</span>
                </div>
                <p class="text-sm text-slate-500 mt-1">AI 視覺以圖搜車查價系統 ＆ 現貨模型車賣場</p>
            </div>
            <div id="auth-container" class="flex flex-wrap items-center gap-2">
                <span id="sync-status" class="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">⏳ 正在連線試算表資料庫...</span>
                <button id="login-btn" onclick="openLoginModal()" class="px-4 py-2 bg-slate-800 text-white text-sm rounded-lg font-bold shadow hover:bg-slate-700 transition">🔐 管理員登入</button>
            </div>
        </header>

        <!-- 導覽切換頁籤 -->
        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button onclick="switchTab('shop')" id="btn-shop" class="px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold">🛒 現貨賣場</button>
            <button onclick="switchTab('pricing')" id="btn-pricing" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow">🔍 AI 雲端歷史成交查價</button>
            <button onclick="switchTab('admin')" id="btn-admin" class="hidden px-6 py-2.5 bg-amber-600 text-white rounded-lg font-bold shadow">⚙️ 上架管理後台</button>
        </div>

        <!-- 嚴格單一品牌分類過濾列 -->
        <div id="category-bar" class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-4 py-1.5 bg-blue-600 text-white text-sm rounded-full font-medium shadow-sm transition">全部品牌</button>
            <button onclick="filterCategory('TOMICA')" data-cat="TOMICA" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">TOMICA (一般紅白盒)</button>
            <button onclick="filterCategory('Cars TOMICA')" data-cat="Cars TOMICA" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">Cars TOMICA</button>
            <button onclick="filterCategory('Mattel Cars')" data-cat="Mattel Cars" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">Mattel Cars (美泰兒)</button>
            <button onclick="filterCategory('Hot Wheels')" data-cat="Hot Wheels" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">Hot Wheels (風火輪)</button>
            <button onclick="filterCategory('Majorette')" data-cat="Majorette" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">Majorette (美捷輪)</button>
            <button onclick="filterCategory('其他廠牌')" data-cat="其他廠牌" class="cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition">其他廠牌</button>
        </div>

        <!-- 查價專區 -->
        <div id="tab-pricing" class="space-y-4 max-w-4xl mx-auto">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <h2 class="font-bold text-lg text-slate-800">📊 AI 視覺辨識 ＆ 雲端成交行情查價中心</h2>
                    <span id="current-brand-badge" class="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-bold border border-blue-200">目前篩選品牌：全部品牌</span>
                </div>

                <!-- 1. AI 照片複製貼上 / 上傳辨識找車區 (移除 contenteditable 防止圖片撐爆排版) -->
                <div class="bg-gradient-to-r from-indigo-50/70 to-blue-50/70 p-4 rounded-2xl border border-indigo-100">
                    <label class="block text-sm font-bold text-indigo-900 mb-2">📸 步驟一：在網頁任意處按 Ctrl+V 貼上車款照片（或點擊下方框上傳），由 AI 找出該車款！</label>
                    <div id="search-paste-zone" tabindex="0" onclick="document.getElementById('search-image-file').click()" class="w-full min-h-[110px] border-2 border-dashed border-indigo-400 rounded-xl p-4 text-xs text-indigo-700 flex flex-col items-center justify-center bg-white hover:bg-indigo-50/40 focus:border-indigo-600 focus:outline-none cursor-pointer transition shadow-sm select-none">
                        <span class="font-bold text-sm">👉 直接按 Ctrl+V 貼上截圖，或點擊此處選擇照片檔案</span>
                        <span class="text-xs text-slate-500 mt-1">AI 會自動看懂車上的載具（如鯊魚、恐龍、怪手、雲梯）與車型，並直接比對您的雲端車名清單！</span>
                    </div>
                    <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-600">上傳照片檔：</span>
                            <input type="file" id="search-image-file" accept="image/*" class="text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer" onchange="handleSearchImageUpload(event)">
                        </div>
                        <button onclick="resetImageSearch()" id="reset-img-btn" class="hidden text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-200 font-bold">❌ 清除照片重新搜尋</button>
                    </div>
                    <!-- AI 辨識結果動態面板 -->
                    <div id="ai-recognition-box" class="hidden mt-3 p-3.5 bg-white rounded-xl border border-indigo-200 shadow-sm space-y-2"></div>
                </div>
                
                <!-- 2. 文字模糊搜尋框 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">🔎 或直接輸入文字 / 編號搜尋（支援多關鍵字精準計分排序）</label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="例如輸入：鯊魚、水族館、閃電麥坤、脫線、編號 62..." class="w-full p-3.5 pl-4 pr-20 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner" oninput="searchData()">
                        <button onclick="clearSearch()" class="absolute right-3 top-3 px-3 py-1.5 bg-slate-100 text-slate-600 text-xs rounded-lg hover:bg-slate-200 font-bold">清除</button>
                    </div>
                </div>

                <!-- 搜尋結果顯示區 -->
                <div id="search-result" class="space-y-3 mt-4 pt-2">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                        <p class="text-xs text-amber-800 font-bold">💡 提示：直接在鍵盤按下 Ctrl+V 貼上車子照片，AI 視覺引擎會在 5 秒內比對您試算表內的 670 筆車名，優先跳出最吻合的車款！</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 現貨賣場專區 -->
        <div id="tab-shop" class="hidden space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="shop-product-grid"></div>
        </div>

        <!-- 管理員後台上架專區 -->
        <div id="tab-admin" class="hidden space-y-4 max-w-xl mx-auto">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="font-bold text-xl mb-4 text-slate-800">📦 新增現貨賣場商品 (管理員專用)</h2>
                <form onsubmit="addProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">車款名稱</label>
                        <input type="text" id="new-name" required placeholder="例如：No.10 Subaru Sambar 吐司麵包車" class="w-full p-3 border border-slate-200 rounded-lg">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">所屬品牌分類</label>
                            <select id="new-category" class="w-full p-3 border border-slate-200 rounded-lg bg-white">
                                <option value="TOMICA">TOMICA (一般紅白盒)</option>
                                <option value="Cars TOMICA">Cars TOMICA</option>
                                <option value="Mattel Cars">Mattel Cars (美泰兒)</option>
                                <option value="Hot Wheels">Hot Wheels (風火輪)</option>
                                <option value="Majorette">Majorette (美捷輪)</option>
                                <option value="其他廠牌">其他廠牌</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">售價 (NT$)</label>
                            <input type="number" id="new-price" required placeholder="280" class="w-full p-3 border border-slate-200 rounded-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">盒況與車況描述</label>
                        <input type="text" id="new-desc" placeholder="例如：1987年絕版｜無盒裸車｜側邊貼紙完整" class="w-full p-3 border border-slate-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">商品照片</label>
                        <input type="file" id="new-image-file" accept="image/*" class="w-full p-2.5 border border-slate-200 rounded-lg text-sm bg-slate-50">
                        <div id="image-preview-container" class="mt-2 hidden">
                            <img id="preview-img" src="" class="h-24 mt-1 rounded-lg border object-cover">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700 transition">確認上架現貨</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 登入彈跳視窗 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-800">🔐 管理員登入</h3>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">帳號 (ID)</label>
                <input type="text" id="login-id" class="w-full p-2.5 border rounded-lg text-sm" placeholder="請輸入帳號">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">密碼 (Password)</label>
                <input type="password" id="login-pwd" class="w-full p-2.5 border rounded-lg text-sm" placeholder="請輸入密碼">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLoginModal()" class="px-4 py-2 bg-slate-200 text-slate-700 text-sm rounded-lg font-bold">取消</button>
                <button onclick="handleLogin()" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg font-bold shadow">登入</button>
            </div>
        </div>
    </div>

    <!-- 點擊放大看照片 Modal -->
    <div id="zoom-modal" onclick="this.classList.add('hidden')" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center z-50 p-4 cursor-zoom-out">
        <img id="zoom-img" src="" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl border-2 border-white object-contain">
    </div>

    <script>
        const SHEET_URLS = [
            "https://docs.google.com/spreadsheets/d/106T9cu6SOHv_CI2XtniEt-4LV90GMng19Ps9S1rmY-k/gviz/tq?tqx=out:csv&gid=331429523",
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTItsSiLskQi5hiYkIyL34MQgMuGGU2NuzSyOVp94tKBGyJqqIEs_IkN6Ez0fjhuBjNG4GIQ9MS_ZqN/pub?gid=331429523&single=true&output=csv",
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTItsSiLskQi5hiYkIyL34MQgMuGGU2NuzSyOVp94tKBGyJqqIEs_IkN6Ez0fjhuBjNG4GIQ9MS_ZqN/pub?output=csv"
        ];

        let savedRecordPhotos = JSON.parse(localStorage.getItem('ruden_car_photos') || '{}');
        let shopProducts = JSON.parse(localStorage.getItem('ruden_shop_products') || '[]');
        if (shopProducts.length === 0) {
            shopProducts = [
                { id: 1, name: "No.10-4 Subaru Sambar 吐司麵包車", category: "TOMICA", price: 280, desc: "1987年絕版老車｜無盒裸車｜側邊貼紙完整", image: "" }
            ];
        }

        let cloudPricingData = [];
        let isLoggedIn = false;
        let currentFilter = 'all';
        let uploadedImageBase64 = "";
        let searchImageBase64 = "";

        window.addEventListener('DOMContentLoaded', async () => {
            setupPasteListeners();
            renderShop();
            await loadCloudData();
        });

        function setupPasteListeners() {
            // 全域監聽 Ctrl+V 貼上圖片，不用怕點錯位置或撐爆版面！
            window.addEventListener('paste', (e) => {
                const items = (e.clipboardData || e.originalEvent.clipboardData)?.items;
                if (!items) return;
                for (let item of items) {
                    if (item.type.indexOf('image') === 0) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        readImageFile(blob, (base64) => {
                            const adminTab = document.getElementById('tab-admin');
                            if (adminTab && !adminTab.classList.contains('hidden')) {
                                uploadedImageBase64 = base64;
                                showPreview(base64);
                            } else {
                                triggerAiImageSearch(base64);
                            }
                        });
                        break;
                    }
                }
            });

            const fileInput = document.getElementById('new-image-file');
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) readImageFile(file, (base64) => {
                        uploadedImageBase64 = base64;
                        showPreview(base64);
                    });
                });
            }
        }

        function readImageFile(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 500;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                        else { w = Math.round(w * maxDim / h); h = maxDim; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function parseValidRows(csvText) {
            if (csvText.includes('<!DOCTYPE html>') || csvText.includes('<html') || csvText.includes('window.WIZ_global_data')) {
                return [];
            }

            const parsed = Papa.parse(csvText, { skipEmptyLines: true });
            const rows = parsed.data;
            const validList = [];

            for (let i = 0; i < rows.length; i++) {
                const cols = rows[i].map(c => String(c || "").trim());
                if (cols.length < 12) continue;

                const rowId = cols[0].replace(/\.0+$/, "");
                const carName = cols[5];
                const rawPrice = cols[11].replace(/[,$\sNT元]/g, "");

                if (!/^\d{1,5}$/.test(rowId)) continue;
                if (!/^\d+(\.\d+)?$/.test(rawPrice)) continue;
                if (!carName || /[{}();=<>]/.test(carName) || carName.includes('window.') || carName.includes('Object.')) continue;

                const recordKey = `${rowId}_${carName}`;
                
                let cloudImgUrl = "";
                for (let c = 15; c < cols.length; c++) {
                    if (cols[c] && cols[c].startsWith('http') && !cols[c].includes('csp.withgoogle')) {
                        cloudImgUrl = cols[c];
                        break;
                    }
                }

                validList.push({
                    id: rowId,
                    key: recordKey,
                    sourcePhoto: cols[1] || "",
                    pos: cols[2] || "",
                    category: cols[3] || "其他廠牌",
                    seriesNum: cols[4] || "",
                    name: carName,
                    vehicleType: cols[6] || "",
                    condition: cols[8] || "",
                    hasBox: cols[10] || "",
                    price: rawPrice,
                    desc: cols[14] || "",
                    image: savedRecordPhotos[recordKey] || cloudImgUrl || ""
                });
            }
            return validList;
        }

        async function loadCloudData() {
            const statusEl = document.getElementById('sync-status');
            cloudPricingData = [];

            for (const url of SHEET_URLS) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const text = await response.text();
                    const extracted = parseValidRows(text);
                    if (extracted.length > 0) {
                        cloudPricingData = extracted;
                        break;
                    }
                } catch (err) {
                    console.warn("嘗試通道失敗:", url);
                }
            }

            if (cloudPricingData.length > 0) {
                statusEl.textContent = `✅ 雲端同步完成 (${cloudPricingData.length} 筆成交紀錄)`;
                statusEl.className = "text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-300 font-bold";
            } else {
                statusEl.textContent = "⚠️ 試算表讀取受阻";
                statusEl.className = "text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200 font-bold";
            }
        }

        // 已修復第 333 行的括號語法錯誤！
        function isStrictCategoryMatch(itemCategory, selectedFilter) {
            if (selectedFilter === 'all') return true;
            const cat = (itemCategory || '').trim().toUpperCase();
            const filter = selectedFilter.trim().toUpperCase();

            if (filter === 'TOMICA') return cat === 'TOMICA' || cat === '多美';
            if (filter === 'CARS TOMICA') return cat === 'CARS TOMICA' || (cat.includes('CARS') && cat.includes('TOMICA'));
            if (filter === 'MATTEL CARS') return cat === 'MATTEL CARS' || cat.includes('MATTEL') || cat.includes('美泰兒');
            if (filter === 'HOT WHEELS') return cat === 'HOT WHEELS' || cat.includes('HOT WHEELS') || cat.includes('風火輪');
            if (filter === 'MAJORETTE') return cat.includes('MAJORETTE') || cat.includes('美捷輪');
            if (filter === '其他廠牌') {
                const known = ['TOMICA', '多美', 'CARS TOMICA', 'MATTEL CARS', 'MATTEL', 'HOT WHEELS', '風火輪', 'MAJORETTE', '美捷輪'];
                return !known.some(k => cat === k || cat.includes(k));
            }
            return cat === filter;
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.className = "cat-btn px-4 py-1.5 bg-blue-600 text-white text-sm rounded-full font-medium shadow-sm transition";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 bg-white text-slate-700 border border-slate-200 text-sm rounded-full font-medium hover:bg-slate-100 transition";
                }
            });

            document.getElementById('current-brand-badge').textContent = `目前篩選品牌：${category === 'all' ? '全部品牌' : category}`;
            renderShop();
            searchData();
        }

        function fuzzyMatchRecords(keywordsArray) {
            let brandFiltered = cloudPricingData.filter(item => isStrictCategoryMatch(item.category, currentFilter));
            const genericWords = ['車', '卡車', '貨車', '跑車', '汽車', '黑色', '白色', '紅色', '藍色', '黃色', '綠色', '黒', '白', '紅', '藍', '黃', '綠', 'truck', 'car'];

            let scoredItems = brandFiltered.map(item => {
                let score = 0;
                const nameLower = item.name.toLowerCase();
                const fullText = `${item.name} ${item.vehicleType} ${item.desc} ${item.seriesNum}`.toLowerCase();

                keywordsArray.forEach((kw, idx) => {
                    const cleanKw = String(kw || "").trim().toLowerCase();
                    if (!cleanKw || cleanKw.length < 1) return;

                    const isGeneric = genericWords.includes(cleanKw);
                    const priorityMultiplier = idx < 4 ? 3.0 : 1.0;

                    if (nameLower === cleanKw) {
                        score += 300;
                    } else if (nameLower.includes(cleanKw)) {
                        score += (isGeneric ? 8 : 90) * priorityMultiplier;
                    } else if (fullText.includes(cleanKw)) {
                        score += (isGeneric ? 3 : 40) * priorityMultiplier;
                    }

                    if (!isGeneric && cleanKw.length >= 2) {
                        for (let i = 0; i < cleanKw.length - 1; i++) {
                            const bigram = cleanKw.substring(i, i + 2);
                            if (bigram !== '卡車' && bigram !== '貨車' && bigram !== '汽車' && nameLower.includes(bigram)) {
                                score += 30;
                            }
                        }
                    }
                });

                return { item, score };
            });

            return scoredItems
                .filter(entry => entry.score >= 15)
                .sort((a, b) => b.score - a.score)
                .map(entry => entry.item);
        }

        function searchData() {
            let rawInput = document.getElementById('search-input').value.trim();
            const resultDiv = document.getElementById('search-result');
            
            if (cloudPricingData.length === 0) return;

            if (!rawInput && currentFilter === 'all') {
                resultDiv.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-200 rounded-xl"><p class="text-xs text-amber-800 font-bold">💡 提示：直接在鍵盤按 Ctrl+V 貼上車款照片讓 AI 自動認車，或輸入關鍵字進行搜尋！</p></div>`;
                return;
            }

            let brandFiltered = cloudPricingData.filter(item => isStrictCategoryMatch(item.category, currentFilter));
            if (!rawInput) {
                displaySearchResults(brandFiltered.slice(0, 50), `單一品牌瀏覽：「${currentFilter}」`);
                return;
            }

            const exactIdMatches = brandFiltered.filter(item => item.id === rawInput);
            const keywords = rawInput.split(/[\s,、｜|\/\(\)（）]+/).filter(Boolean);
            const fuzzyMatches = fuzzyMatchRecords(keywords);
            const combined = [...exactIdMatches, ...fuzzyMatches.filter(f => !exactIdMatches.includes(f))];

            displaySearchResults(combined.slice(0, 24), `搜尋關鍵字：「${rawInput}」`);
        }

        function handleSearchImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                readImageFile(file, (base64) => {
                    triggerAiImageSearch(base64);
                });
            }
        }

        // 具備 8 秒超時保護的 AI 視覺辨識，絕不卡死
        async function callFreeVisionAI(base64Str) {
            const sampleNames = [...new Set(cloudPricingData.map(d => d.name))].slice(0, 180).join("、");

            const prompt = `你是 Tomica (多美小汽車)、Disney Cars、Hot Wheels 鑑定專家。
請辨識這張照片中的模型車（特別注意車上載運的主題物品，例如：載著鯊魚的水族館卡車 Aquarium Truck、恐龍搬運車、熊貓車、雲梯消防車、挖土機、閃電麥坤等，忽略價格標籤）。
參考賣家車名庫：【${sampleNames}】
請只回傳 JSON（不要加 markdown）：
{
  "carName": "最準確的中文與英文車名（如：水族館卡車 Aquarium Truck）",
  "keywords": ["最核心獨特詞1(如:水族館)", "核心詞2(如:Aquarium)", "核心詞3(如:鯊魚)", "車廠或車種(如:五十鈴/日野/搬運車)"]
}`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: "openai",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: prompt },
                                    { type: "image_url", image_url: { url: base64Str } }
                                ]
                            }
                        ],
                        temperature: 0.1
                    })
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                return data.choices?.[0]?.message?.content || "";
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function triggerAiImageSearch(base64Str) {
            searchImageBase64 = base64Str;
            document.getElementById('reset-img-btn').classList.remove('hidden');
            const searchPasteZone = document.getElementById('search-paste-zone');
            const aiBox = document.getElementById('ai-recognition-box');

            // 固定縮圖高度為 h-24 w-24，絕對不會撐爆整個畫面！
            searchPasteZone.innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${base64Str}" class="h-24 w-24 object-cover rounded-xl border-2 border-indigo-500 shadow-md flex-shrink-0">
                    <div class="text-left">
                        <div class="text-indigo-700 font-bold text-sm">📸 搜尋照片已成功載入！</div>
                        <div class="text-xs text-slate-500 mt-1">AI 視覺大腦正在分析車體與載具特徵，並比對 670 筆雲端紀錄...</div>
                    </div>
                </div>`;

            aiBox.classList.remove('hidden');
            aiBox.innerHTML = `<div class="text-xs text-indigo-600 font-bold animate-pulse">🤖 AI 正在看圖認車（預計 3~5 秒內完成）...</div>`;

            try {
                const rawText = await callFreeVisionAI(base64Str);
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                
                if (jsonMatch) {
                    const parsed = JSON.parse(jsonMatch[0]);
                    const keywords = parsed.keywords || [];
                    const allSearchTerms = [parsed.carName, ...keywords].filter(Boolean);
                    
                    let tagsHtml = [...new Set(keywords)].map(k => 
                        `<button onclick="document.getElementById('search-input').value='${k}'; searchData();" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-full text-xs font-bold border border-indigo-200 transition">🔍 ${k}</button>`
                    ).join(' ');

                    aiBox.innerHTML = `
                        <div class="text-xs space-y-2">
                            <div class="font-bold text-emerald-700 text-sm">🎯 AI 視覺辨識結果：<span class="text-slate-900">${parsed.carName}</span></div>
                            <div class="flex flex-wrap items-center gap-1.5">
                                <span class="text-slate-500">點擊特徵標籤可單獨篩選：</span>
                                ${tagsHtml}
                            </div>
                        </div>`;

                    document.getElementById('search-input').value = keywords.join(' ');
                    const matches = fuzzyMatchRecords(allSearchTerms);
                    displaySearchResults(matches.slice(0, 16), `🤖 AI 視覺精準比對：「${parsed.carName}」`);
                } else {
                    throw new Error("解析失敗");
                }
            } catch (err) {
                console.warn("AI 連線逾時，提供快速特徵按鈕:", err);
                const quickTags = ['水族館', 'Aquarium', '雲梯', '工程車', '閃電麥坤', '脫線', '推土機', '砂石車'];
                let tagsHtml = quickTags.map(k => 
                    `<button onclick="document.getElementById('search-input').value='${k}'; searchData();" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-full text-xs font-bold border border-indigo-200 transition">🔍 ${k}</button>`
                ).join(' ');

                aiBox.innerHTML = `
                    <div class="text-xs space-y-2">
                        <div class="text-amber-700 font-bold">⚡ 免費 AI 通道目前瞬時擁塞，您可以直接點擊下方熱門特徵或於搜尋框輸入 2 個字立即秒搜：</div>
                        <div class="flex flex-wrap items-center gap-1.5">${tagsHtml}</div>
                    </div>`;
            }
        }

        function resetImageSearch() {
            searchImageBase64 = "";
            document.getElementById('search-image-file').value = "";
            document.getElementById('reset-img-btn').classList.add('hidden');
            document.getElementById('ai-recognition-box').classList.add('hidden');
            document.getElementById('search-paste-zone').innerHTML = `
                <span class="font-bold text-sm">👉 直接按 Ctrl+V 貼上截圖，或點擊此處選擇照片檔案</span>
                <span class="text-xs text-slate-500 mt-1">AI 會自動看懂車上的載具（如鯊魚、恐龍、怪手、雲梯）與車型，並直接比對您的雲端車名清單！</span>`;
            searchData();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            resetImageSearch();
        }

        function displaySearchResults(matches, titleInfo) {
            const resultDiv = document.getElementById('search-result');

            if (matches.length === 0) {
                resultDiv.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl"><p class="text-xs text-red-700 font-bold">找不到相符的車款，請嘗試點擊上方不同的特徵標籤，或輸入更簡短的關鍵字（如「水族館」、「卡車」）。</p></div>`;
                return;
            }

            let htmlOutput = `<p class="text-xs text-slate-500 mb-3 font-bold">🔎 ${titleInfo} ｜ 共找到 <b>${matches.length}</b> 款最相近的成交紀錄（依相似度高低排序）：</p>`;
            htmlOutput += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            matches.forEach((item, index) => {
                const currentImg = savedRecordPhotos[item.key] || item.image;
                const googleImgSearchUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.category + ' ' + item.name)}`;

                const imgElement = currentImg 
                    ? `<img src="${currentImg}" onclick="zoomImage(this.src)" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" class="w-full h-full object-cover cursor-zoom-in" title="點擊放大檢視">`
                    : ``;

                const fallbackClass = currentImg ? "hidden" : "";
                const topMatchBadge = index === 0 ? `<span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold shadow-sm">👑 最吻合</span>` : '';

                htmlOutput += `
                    <div class="p-4 border ${index === 0 ? 'border-2 border-emerald-500 bg-emerald-50/20' : 'border-slate-200 bg-white'} rounded-2xl hover:border-blue-400 hover:shadow-md transition flex gap-4 items-center">
                        <div class="relative w-28 h-28 flex-shrink-0 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex flex-col items-center justify-center text-center">
                            ${imgElement}
                            <div class="${fallbackClass} p-2 flex flex-col items-center justify-center">
                                <span class="text-xs font-bold text-slate-500">編號 #${item.id}</span>
                                <span class="text-[10px] text-slate-400 mt-0.5">${item.sourcePhoto} ${item.pos}</span>
                                <a href="${googleImgSearchUrl}" target="_blank" class="mt-1.5 px-2 py-1 bg-indigo-50 text-indigo-600 rounded text-[10px] font-bold hover:bg-indigo-100 border border-indigo-200">🌐 看同款車圖</a>
                            </div>
                        </div>

                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-center gap-1">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[11px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold">${item.category}</span>
                                    ${topMatchBadge}
                                </div>
                                <span class="text-[11px] text-slate-400 font-bold">編號 #${item.id}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-base mt-1 leading-snug">${item.name}</h3>
                            <div class="mt-2 flex items-baseline gap-2">
                                <span class="text-xs text-slate-500 font-bold">成交價：</span>
                                <span class="text-red-600 font-extrabold text-xl">NT$ ${item.price}</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1 truncate" title="${item.desc}">📦 ${item.desc || '無備註'}</p>
                            <p class="text-[11px] text-slate-400 mt-0.5">
                                ${item.condition ? `⭐ 車況 ${item.condition} 星 ｜ ` : ''}
                                🖼️ 原圖：${item.sourcePhoto || '無'} ${item.pos}
                            </p>
                        </div>
                    </div>
                `;
            });
            htmlOutput += `</div>`;
            resultDiv.innerHTML = htmlOutput;
        }

        function zoomImage(src) {
            document.getElementById('zoom-img').src = src;
            document.getElementById('zoom-modal').classList.remove('hidden');
        }

        function renderShop() {
            const grid = document.getElementById('shop-product-grid');
            const filtered = shopProducts.filter(p => isStrictCategoryMatch(p.category, currentFilter));
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-100">目前此分類尚無上架現貨商品</div>`;
                return;
            }
            let html = '';
            filtered.forEach(p => {
                let imgHtml = p.image 
                    ? `<img src="${p.image}" onclick="zoomImage('${p.image}')" class="w-full h-44 object-cover rounded-lg mb-3 border cursor-zoom-in">`
                    : `<div class="w-full h-44 bg-slate-100 rounded-lg mb-3 flex items-center justify-center text-slate-400 text-xs">暫無商品照片</div>`;
                html += `
                    <div class="bg-white border border-slate-100 p-4 rounded-xl shadow-sm flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            ${imgHtml}
                            <span class="text-xs bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full font-bold">${p.category}</span>
                            <h3 class="font-bold text-slate-800 mt-2 text-base">${p.name}</h3>
                            <p class="text-xs text-slate-500 mt-1">${p.desc}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-red-600 font-bold text-lg">NT$ ${p.price}</span>
                            <button onclick="alert('已加入購物車！請截圖私訊賣家結帳。')" class="px-3.5 py-1.5 bg-blue-600 text-white text-xs rounded-lg font-bold hover:bg-blue-700">加入購物車</button>
                        </div>
                    </div>`;
            });
            grid.innerHTML = html;
        }

        function showPreview(src) {
            document.getElementById('preview-img').src = src;
            document.getElementById('image-preview-container').classList.remove('hidden');
        }

        function switchTab(tab) {
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById('tab-pricing').classList.add('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
            document.getElementById('btn-shop').className = 'px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold';
            document.getElementById('btn-pricing').className = 'px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold';
            if(isLoggedIn) document.getElementById('btn-admin').className = 'px-6 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-bold';

            if (tab === 'shop') {
                document.getElementById('tab-shop').classList.remove('hidden');
                document.getElementById('btn-shop').className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow';
                renderShop();
            } else if (tab === 'pricing') {
                document.getElementById('tab-pricing').classList.remove('hidden');
                document.getElementById('btn-pricing').className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow';
            } else if (tab === 'admin' && isLoggedIn) {
                document.getElementById('tab-admin').classList.remove('hidden');
                document.getElementById('btn-admin').className = 'px-6 py-2.5 bg-amber-600 text-white rounded-lg font-bold shadow';
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

        function handleLogin() {
            const id = document.getElementById('login-id').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();
            if (id === "聖引" && pwd === "0973117607*") {
                isLoggedIn = true;
                closeLoginModal();
                document.getElementById('login-btn').outerHTML = `<span class="text-xs font-bold text-amber-700 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-300">👤 管理員：聖引</span>`;
                document.getElementById('btn-admin').classList.remove('hidden');
            } else {
                alert("帳號或密碼錯誤！");
            }
        }

        function addProduct(event) {
            event.preventDefault();
            const name = document.getElementById('new-name').value;
            const category = document.getElementById('new-category').value;
            const price = Number(document.getElementById('new-price').value);
            const desc = document.getElementById('new-desc').value;
            shopProducts.unshift({ id: Date.now(), name, category, price, desc, image: uploadedImageBase64 });
            localStorage.setItem('ruden_shop_products', JSON.stringify(shopProducts));
            switchTab('shop');
        }
    </script>
