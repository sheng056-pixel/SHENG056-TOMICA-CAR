<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomica 智慧查價與現貨賣場</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-slate-800">🚗 Tomica 智慧查價與現貨賣場</h1>
            <p class="text-sm text-slate-500 mt-1">內建 AI 拍照辨識、三語模糊搜尋與歷史成交比對</p>
        </header>

        <!-- 導覽切換 -->
        <div class="flex justify-center gap-4 mb-6">
            <button onclick="switchTab('shop')" id="btn-shop" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow">🛒 我要買車</button>
            <button onclick="switchTab('pricing')" id="btn-pricing" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold">🔍 我要查價 & AI 拍照辨識</button>
        </div>

        <!-- 買車專區 -->
        <div id="tab-shop" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
                <h2 class="font-bold text-lg mb-2">📦 現貨上架車款</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border p-4 rounded-lg bg-slate-50">
                        <h3 class="font-bold text-blue-600">No.10-4 Subaru Sambar 吐司麵包車</h3>
                        <p class="text-xs text-slate-500 mt-1">1987年絕版老車｜無盒裸車｜側邊貼紙完整</p>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-red-500 font-bold text-lg">NT$ 280</span>
                            <button onclick="alert('已加入購物車！')" class="px-4 py-1.5 bg-blue-500 text-white text-sm rounded">加入購物車</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 查價專區 -->
        <div id="tab-pricing" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
                <h2 class="font-bold text-lg mb-2">📊 智慧查價與歷史成交中心</h2>
                
                <!-- 新增：AI 拍照辨識區塊 -->
                <div class="mb-4 p-4 bg-indigo-50 border border-indigo-100 rounded-lg">
                    <label class="block font-bold text-indigo-900 mb-2">📸 AI 拍照 / 圖片辨識查價</label>
                    <input type="file" id="ai-photo-input" accept="image/*" capture="environment" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer" onchange="handleImageUpload(event)">
                    <p class="text-xs text-indigo-700 mt-2">提示：上傳或用手機直接拍下你的模型車，AI 將自動辨識車型並帶入下方搜尋。</p>
                </div>

                <input type="text" id="search-input" placeholder="或手動輸入關鍵字（支援中、英、日文與模糊搜尋）" class="w-full p-3 border rounded-lg mb-3" oninput="searchData()">
                
                <div id="search-result" class="space-y-3">
                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg">
                        <p class="text-xs text-amber-800 font-bold">💡 提示：試著上傳照片或輸入關鍵字，系統會自動比對您的歷史成交與行情。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mockDatabase = [
            { id: 2, name: "森田 機場消防車 Morita Airport Fire Truck", jp: "モリタ 機場消防車", category: "消防警車", price: 120, box: "無盒", condition: "一般戰損" },
            { id: 10, name: "雷蒙 紫色 Ramone Purple (Cars系列)", jp: "ラモーン", category: "Cars角色", price: 100, box: "無盒", condition: "乾淨" },
            { id: 19, name: "斯巴魯 360 十週年紀念版 Subaru 360 10th Anniversary", jp: "スバル 360", category: "一般轎車", price: 70, box: "無盒", condition: "前保桿微掉漆" },
            { id: "No.10-4", name: "Subaru Sambar 吐司麵包車 (1987絕版)", jp: "スバル サンバー パン屋", category: "商用車", price: 280, box: "無盒裸車", condition: "貼紙完整/輕微掉漆" }
        ];

        const synonymMap = {
            "subaru": "斯巴魯", "スバル": "斯巴魯", "sambar": "吐司麵包車", "パン屋": "吐司麵包車",
            "fire": "消防車", "消防車": "消防車", "モリタ": "消防車", "mcqueen": "麥坤", "マックィーン": "麥坤"
        };

        function switchTab(tab) {
            if (tab === 'shop') {
                document.getElementById('tab-shop').classList.remove('hidden');
                document.getElementById('tab-pricing').classList.add('hidden');
                document.getElementById('btn-shop').className = 'px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow';
                document.getElementById('btn-pricing').className = 'px-6 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold';
            } else {
                document.getElementById('tab-shop').classList.add('hidden');
                document.getElementById('tab-pricing').classList.remove('hidden');
                document.getElementById('btn-pricing').className = 'px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow';
                document.getElementById('btn-shop').className = 'px-6 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold';
            }
        }

        // 模擬 AI 辨識圖片並自動帶入關鍵字
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const resultDiv = document.getElementById('search-result');
            resultDiv.innerHTML = `<div class="p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-center"><p class="text-sm text-indigo-800 font-bold animate-pulse">🤖 AI 正在辨識圖片中的車款特徵...</p></div>`;

            // 模擬 AI 辨識延遲後，自動填入「斯巴魯」作為辨識結果範例
            setTimeout(() => {
                document.getElementById('search-input').value = "斯巴魯";
                searchData();
            }, 1200);
        }

        function searchData() {
            let keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const resultDiv = document.getElementById('search-result');
            
            if (!keyword) {
                resultDiv.innerHTML = `<div class="p-3 bg-amber-50 border border-amber-200 rounded-lg"><p class="text-xs text-amber-800 font-bold">💡 請上傳照片或輸入關鍵字搜尋您的歷史成交與行情。</p></div>`;
                return;
            }

            let translatedKeyword = synonymMap[keyword] || keyword;

            const matches = mockDatabase.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.name.toLowerCase().includes(translatedKeyword) ||
                item.jp.toLowerCase().includes(keyword) ||
                item.category.toLowerCase().includes(keyword) ||
                String(item.id).toLowerCase().includes(keyword)
            );

            if (matches.length === 0) {
                resultDiv.innerHTML = `<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><p class="text-xs text-red-700 font-bold">找不到符合「${keyword}」的車款。</p></div>`;
                return;
            }

            let htmlOutput = `<p class="text-xs text-slate-500 mb-2">🔎 搜尋關鍵字：${keyword} ｜ 找到 ${matches.length} 筆紀錄：</p>`;
            
            matches.forEach(item => {
                htmlOutput += `
                    <div class="p-4 border rounded-lg bg-blue-50/50 space-y-2 mb-2">
                        <div class="flex justify-between">
                            <span class="font-bold text-slate-800">${item.name}</span>
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">編號: ${item.id}</span>
                        </div>
                        <div class="text-sm text-slate-600 space-y-1">
                            <p>🇯🇵 <b>日文原名</b>：${item.jp}</p>
                            <p>📌 <b>您的過往成交價</b>：NT$ ${item.price}</p>
                            <p>📦 <b>盒況與車況</b>：${item.box} ｜ ${item.condition}</p>
                            <p>📉 <b>戰損裸車系統建議定價</b>：NT$ ${Math.round(item.price * 1.1)}</p>
                        </div>
                    </div>
                `;
            });
            resultDiv.innerHTML = htmlOutput;
        }
    </script>
</body>
</html>
